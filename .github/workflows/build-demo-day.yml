name: build demo day

on:
  workflow_dispatch:
  push:
    branches: [feat/notice-signals]
    paths: [backend/build_demo_day.py, .github/workflows/build-demo-day.yml]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install torch==2.9.0 torchvision==0.24.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r frontend/requirements.txt
      - name: Build the day
        run: python backend/build_demo_day.py
      - uses: actions/upload-artifact@v4
        with:
          name: demo-day
          path: backend/knowledge/demo_day.db
