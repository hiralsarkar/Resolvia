ca Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8E99AC" text-anchor="start">One frozen embedding model, three local indexes, compared by dot product</text><rect x="32.0" y="112.0" width="178.0" height="96.0" rx="10" fill="#0E2430" stroke="#4CE0FF" stroke-width="1.4"/><text x="48.0" y="143.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#4CE0FF" text-anchor="start">Query text</text><text x="48.0" y="163.5" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8E99AC" text-anchor="start">the document itself,</text><text x="48.0" y="182.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8E99AC" text-anchor="start">or cause + fields</text><path d="M210.0 160.0 L236.0 160.0" fill="none" stroke="#4CE0FF" stroke-width="1.6" marker-end="url(#arr-4CE0FF)"/><rect x="238.0" y="112.0" width="178.0" height="96.0" rx="10" fill="#1B1734" stroke="#A78BFA" stroke-width="1.4"/><text x="254.0" y="143.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#A78BFA" text-anchor="start">all-MiniLM-L6-v2</text><text x="254.0" y="163.5" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8E99AC" text-anchor="start">used as-is</text><text x="254.0" y="182.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8E99AC" text-anchor="start">→ 384 numbers</text><path d="M416.0 160.0 L442.0 160.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#arr-A78BFA)"/><rect x="444.0" y="96.0" width="210.0" height="36.0" rx="8" fill="#0E2430" stroke="#4CE0FF" stroke-width="1.4"/><text x="458.0" y="119.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-siz