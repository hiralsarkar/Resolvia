<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Responsible AI, built into the workflow"><title>Responsible AI, built into the workflow</title><defs><marker id="arr-4CE0FF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4CE0FF"/></marker><marker id="arr-FFB454" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FFB454"/></marker><marker id="arr-8E99AC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8E99AC"/></marker><marker id="arr-7A8296" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7A8296"/></marker><marker id="arr-FF7AC6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FF7AC6"/></marker><marker id="arr-A78BFA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A78BFA"/></marker><marker id="arr-34E5A6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34E5A6"/></marker><marker id="arr-FF5C7A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FF5C7A"/></marker></defs><rect width="960" height="500" rx="18" fill="#0B0F16"/><rect x="0.5" y="0.5" width="959" height="499" rx="18" fill="none" stroke="#1C2433"/><text x="32.0" y="46.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#E8EDF5" text-anchor="start">Responsible AI, built into the workflow</text><text x="32.0" y="70.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8E99AC" text-anchor="start">Six principles and where each one lives in Resolvia</text><rect x="32" y="96" width="290" height="168" rx="12" fill="#111722" stroke="#2A3446"/><rect x="32" y="96" width="290" height="4" rx="2" fill="#FFB454"/><text x="50.0" y="132.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFB454" text-anchor="start">Human oversight</text><text x="50.0" y="160.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E8EDF5" text-anchor="start">A person must approve anything</text><text x="50.0" y="180.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E8EDF5" text-anchor="start">that moves money, an SSI or a</text><text x="50.0" y="200.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E8EDF5" text-anchor="start">counterparty. CA breaks always.</text><rect x="50" y="224" width="254" height="26" rx="13" fill="none" stroke="#FFB454" stroke-width="1.2"/><text x="177.0" y="241.5" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#FFB454" text-anchor="middle">77% of test breaks waited</text><rect x="334" y="96" width="290" height="168" rx="12" fill="#111722" stroke="#2A3446"/><rect x="334" y="96" width="290" height="4" rx="2" fill="#FF7AC6"/><text x="352.0" y="132.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FF7AC6" text-anchor="start">Accountability</text><text x="352.0" y="160.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E8EDF5" text-anchor="start">Named approver and a note on</text><text x="352.0" y="180.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E8EDF5" text-anchor="start">every decision. One door in:</text><text x="352.0" y="200.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E8EDF5" text-anchor="start">record_decision().</text><rect x="352" y="224" width="254" height="26" rx="13" fill="none" stroke="#FF7AC6" stroke-width="1.2"/><text x="479.0" y="241.5" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#FF7AC6" text-anchor="middle">0 unauthorised actions</text><rect x="636" y="96" width="290" height="168" rx="12" fill="#111722" stroke="#2A3446"/><rect x="636" y="96" width="290" height="4" rx="2" fill="#A78BFA"/><text x="654.0" y="132.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#A78BFA" text-anchor="start">Transparency</text><text x="654.0" y="160.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E8EDF5" text-anchor="start">Each diagnosis shows expected,</text><text x="654.0" y="180.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E8EDF5" text-anchor="start">actual, confidence, alternatives</text><text x="654.0" y="200.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E8EDF5" text-anchor="start">and the evidence it used.</text><rect x="654" y="224" width="254" height="26" rx="13" fill="none" stroke="#A78BFA" stroke-width="1.2"/><text x="781.0" y="241.5" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#A78BFA" text-anchor="middle">notice overrides are logged</text><rect x="32" y="278" width="290" height="168" rx="12" fill="#111722" stroke="#2A3446"/><rect x="32" y="278" width="290" height="4" rx="2" fill="#34E5A6"/><text x="50.0" y="314.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#34E5A6" text-anchor="start">Reliability</text><text x="50.0" y="342.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E8EDF5" text-anchor="start">Fixes run on copies. Validation</text><text x="50.0" y="362.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E8EDF5" text-anchor="start">re-checks the field, so a wrong</text><text x="50.0" y="382.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E8EDF5" text-anchor="start">diagnosis reopens the case.</text><rect x="50" y="406" width="254" height="26" rx="13" fill="none" stroke="#34E5A6" stroke-width="1.2"/><text x="177.0" y="423.5" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#34E5A6" text-anchor="middle">test set used once</text><rect x="334" y="278" width="290" height="168" rx="12" fill="#111722" stroke="#2A3446"/><rect x="334" y="278" width="290" height="4" rx="2" fill="#4CE0FF"/><text x="352.0" y="314.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#4CE0FF" text-anchor="start">Privacy</text><text x="352.0" y="342.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E8EDF5" text-anchor="start">Synthetic data, no customer</text><text x="352.0" y="362.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E8EDF5" text-anchor="start">details. Uploaded files stay in</text><text x="352.0" y="382.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E8EDF5" text-anchor="start">memory and are never stored.</text><rect x="352" y="406" width="254" height="26" rx="13" fill="none" stroke="#4CE0FF" stroke-width="1.2"/><text x="479.0" y="423.5" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#4CE0FF" text-anchor="middle">no real PII anywhere</text><rect x="636" y="278" width="290" height="168" rx="12" fill="#111722" stroke="#2A3446"/><rect x="636" y="278" width="290" height="4" rx="2" fill="#7A8296"/><text x="654.0" y="314.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#7A8296" text-anchor="start">Bounded GenAI</text><text x="654.0" y="342.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E8EDF5" text-anchor="start">The LLM only explains or</text><text x="654.0" y="362.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E8EDF5" text-anchor="start">extracts. It is optional and is</text><text x="654.0" y="382.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E8EDF5" text-anchor="start">never allowed to decide.</text><rect x="654" y="406" width="254" height="26" rx="13" fill="none" stroke="#7A8296" stroke-width="1.2"/><text x="781.0" y="423.5" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#7A8296" text-anchor="middle">off without an API key</text><text x="32.0" y="476.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8E99AC" text-anchor="start">Every card points at code in the repo, not a policy promise. Details in docs/08-responsible-ai.md.</text></svg>